<!doctype html>

<style>
:root{--bg:#101116;--panel:#191b23;--panel2:#20232d;--line:#303440;--text:#f4f5f7;--muted:#9ba3b4;--orange:#ff7a1a;--orange2:#ffad61;--green:#50e3a4;--red:#ff667a;--blue:#7aa7ff;--purple:#c29aff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 15% -10%,#48230e 0,transparent 34%),radial-gradient(ellipse at 100% 5%,#202442 0,transparent 25%),var(--bg);color:var(--text);font:15px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial}
button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.shell{max-width:1440px;margin:auto;padding:24px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:24px}.brand{display:flex;align-items:center;gap:12px}.logo{width:48px;height:48px;border:1px solid #80431e;background:linear-gradient(145deg,#332016,#171920);border-radius:14px;display:grid;place-items:center;color:var(--orange);font-weight:950;letter-spacing:-2px;font-size:20px;box-shadow:0 0 28px #ff7a1a1a}.brand h1{font-size:18px;margin:0;letter-spacing:.12em}.brand p{margin:2px 0 0;color:var(--muted);font-size:11px;letter-spacing:.18em}.top-actions{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.chip,.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:10px;padding:10px 13px}.chip{color:var(--muted);font-size:12px}.btn:hover{border-color:var(--orange)}.btn.primary{background:var(--orange);border-color:var(--orange);color:#1a110a;font-weight:800}.btn.ghost{background:transparent}.layout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:22px}.sidebar{align-self:start;position:sticky;top:18px;background:#15171eaa;border:1px solid var(--line);border-radius:18px;padding:12px}.navbtn{width:100%;text-align:left;display:flex;align-items:center;gap:11px;padding:12px;border:0;border-radius:10px;color:var(--muted);background:transparent;margin:2px 0}.navbtn .ico{width:22px;text-align:center;font-size:17px}.navbtn.active,.navbtn:hover{color:var(--text);background:#ff7a1a16}.navbtn.active{box-shadow:inset 3px 0 var(--orange)}.sidefoot{border-top:1px solid var(--line);margin-top:14px;padding:14px 8px 4px;color:var(--muted);font-size:12px}.sidefoot b{color:var(--green)}main{min-width:0}.pagehead{display:flex;justify-content:space-between;align-items:end;gap:12px;margin:2px 0 20px}.eyebrow{color:var(--orange2);font-size:11px;font-weight:800;letter-spacing:.19em;text-transform:uppercase}.pagehead h2{font-size:clamp(24px,3vw,34px);line-height:1.1;margin:7px 0}.pagehead p{margin:0;color:var(--muted)}.date{font-size:12px;color:var(--muted);text-align:right}.grid{display:grid;gap:14px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:14px}.card{background:linear-gradient(145deg,#1b1d26f5,#15171df5);border:1px solid var(--line);border-radius:16px;padding:18px;min-width:0;box-shadow:0 12px 32px #00000016}.statlabel{font-size:11px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}.statvalue{font-size:28px;font-weight:850;letter-spacing:-.04em;margin:8px 0 4px}.statnote{font-size:12px;color:var(--muted)}.orange{color:var(--orange)}.green{color:var(--green)}.purple{color:var(--purple)}.blue{color:var(--blue)}.progress{height:7px;background:#30323b;border-radius:99px;overflow:hidden;margin-top:12px}.progress span{height:100%;display:block;background:linear-gradient(90deg,var(--orange),#ffd09a);border-radius:99px;transition:width .25s}.maincols{grid-template-columns:minmax(0,1.2fr) minmax(280px,.8fr)}.sectiontitle{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}.sectiontitle h3{margin:0;font-size:16px}.sectiontitle span{font-size:11px;color:var(--muted)}.quest{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid #2a2d36}.quest:last-child{border-bottom:0;padding-bottom:0}.check{width:23px;height:23px;border-radius:7px;border:1px solid #565b68;background:#14161c;color:#121318;display:grid;place-items:center;flex-shrink:0}.check.done{background:var(--green);border-color:var(--green)}.qtext{flex:1;min-width:0}.qtext b{display:block;font-size:13px}.qtext small{color:var(--muted);font-size:11px}.xpmini{color:var(--orange2);font-size:12px;font-weight:800;white-space:nowrap}.pill{border-radius:6px;padding:4px 7px;font-size:10px;font-weight:800;letter-spacing:.04em;background:#ff7a1a1a;color:var(--orange2)}.habitrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #2a2d36}.habitrow:last-child{border:0}.habitrow label{flex:1;font-size:13px}.habitrow input{accent-color:var(--orange);width:17px;height:17px}.two{grid-template-columns:1fr 1fr}.stack{display:grid;gap:14px}.activitybar{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:145px;padding-top:8px}.daybar{display:flex;flex-direction:column;align-items:center;gap:7px;height:100%;justify-content:end}.bar{width:100%;max-width:34px;min-height:4px;border-radius:7px 7px 3px 3px;background:linear-gradient(180deg,var(--orange2),var(--orange));position:relative}.barlabel{font-size:10px;color:var(--muted)}.barval{font-size:10px;color:var(--muted)}.empty{padding:26px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px;font-size:13px}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:12px;color:var(--muted)}.field input,.field select,.field textarea{width:100%;background:#101218;border:1px solid #383c48;color:var(--text);border-radius:9px;padding:11px}.field textarea{min-height:90px;resize:vertical}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:12px;min-width:540px}.table th,.table td{text-align:left;padding:12px 10px;border-bottom:1px solid var(--line)}.table th{color:var(--muted);font-size:10px;letter-spacing:.08em;text-transform:uppercase}.table td{vertical-align:middle}.achievement{display:flex;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}.achievement:last-child{border:0}.badgeicon{width:42px;height:42px;display:grid;place-items:center;border-radius:12px;background:#ff7a1a16;border:1px solid #7c472b;font-size:20px}.achievement.locked{opacity:.48;filter:grayscale(.7)}.achievement div:nth-child(2){flex:1}.achievement b{font-size:13px}.achievement small{display:block;color:var(--muted);margin-top:3px}.achievement strong{font-size:10px;color:var(--orange2)}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#222630;border:1px solid #4d535f;border-radius:12px;padding:12px 18px;box-shadow:0 10px 35px #0007;z-index:5;font-size:13px}.hidden{display:none!important}.subnav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.tiny{font-size:11px;color:var(--muted)}.callout{border:1px solid #714222;background:#ff7a1a0c;border-radius:12px;padding:13px 15px;color:#e9c5a6;font-size:12px;margin-top:14px}.danger{color:var(--red)}.kpirow{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:12px}.kpirow:last-child{border:0}.kpirow span{color:var(--muted)}.footer{text-align:center;color:#626979;font-size:11px;margin:26px 0 4px}
@media(max-width:900px){.layout{grid-template-columns:1fr}.sidebar{position:static;display:flex;overflow:auto;padding:7px;gap:4px}.navbtn{width:auto;white-space:nowrap;padding:10px}.sidefoot{display:none}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.maincols{grid-template-columns:1fr}.shell{padding:15px}.topbar{align-items:flex-start}.brand p{letter-spacing:.08em}.date{display:none}}
@media(max-width:500px){.topbar{flex-direction:column}.top-actions{width:100%}.top-actions .btn{flex:1}.formgrid,.two{grid-template-columns:1fr}.card{padding:14px}.statvalue{font-size:24px}.pagehead{align-items:start;flex-direction:column}.stats{gap:9px}.navbtn{font-size:12px}.navbtn .ico{display:none}}
</style>

<body>
<div class="shell">
<header class="topbar">
 <div class="brand"><div class="logo">DC</div><div><h1>DC: LEVEL UP</h1><p>PERSONAL PERFORMANCE SYSTEM</p></div></div>
 <div class="top-actions"><span class="chip" id="syncStatus">● ЛОКАЛЬНЫЙ РЕЖИМ · ОФЛАЙН</span><button class="btn ghost" id="exportBtn">↗ Экспорт данных</button><button class="btn primary" id="quickAddBtn">＋ Запись дня</button></div>
</header>
<div class="layout">
 <aside class="sidebar">
  <button class="navbtn active" data-page="dashboard"><span class="ico">▦</span> Дашборд</button>
  <button class="navbtn" data-page="quests"><span class="ico">⚔</span> Квесты</button>
  <button class="navbtn" data-page="habits"><span class="ico">◉</span> Привычки</button>
  <button class="navbtn" data-page="analytics"><span class="ico">⌁</span> Аналитика</button>
  <button class="navbtn" data-page="distractions"><span class="ico">◌</span> Отвлечения</button>
  <button class="navbtn" data-page="achievements"><span class="ico">✦</span> Достижения</button>
  <button class="navbtn" data-page="settings"><span class="ico">⚙</span> Настройки</button>
  <div class="sidefoot">СИСТЕМА АКТИВНА<br><b>● Данные хранятся локально</b></div>
 </aside>
 <main id="app"></main>
</div>
<div class="footer">DC: LEVEL UP · ТВОЙ ПУТЬ, ТВОИ ПРАВИЛА · v1.0</div>
</div>
<div id="toast" class="toast hidden"></div>
<script>
const KEY='dc-level-up-v1';
const defaultData=()=>({
 settings:{dailyGoal:3,xpPerQuest:25,xpPerHabit:10,levelSize:250,tiktokLimit:30},
 habits:[
  {id:'h1',name:'Английский 10+ минут',category:'Развитие',xp:10,active:true},
  {id:'h2',name:'Прогулка / движение',category:'Здоровье',xp:10,active:true},
  {id:'h3',name:'Чтение или обучение',category:'Развитие',xp:10,active:true},
  {id:'h4',name:'Фокус-сессия 25 минут',category:'Фокус',xp:10,active:true},
  {id:'h5',name:'Работа над проектом DC',category:'DC / бизнес',xp:10,active:true},
  {id:'h6',name:'TikTok в пределах лимита',category:'Фокус',xp:10,active:true}
 ],
 quests:[
  {id:'q1',name:'5 занятий английским',desc:'Короткие офлайн-сессии по 10+ минут',category:'Развитие',xp:25,done:false},
  {id:'q2',name:'Записать 10 идей для Reels',desc:'Идеи личного бренда и POV-контента',category:'DC / медиа',xp:25,done:false},
  {id:'q3',name:'3 фокус-сессии',desc:'25 минут работы без ленты и переключений',category:'Фокус',xp:25,done:false},
  {id:'q4',name:'Собрать бюджет теста трафика',desc:'Гипотеза, лимит бюджета и критерий остановки',category:'DC / бизнес',xp:25,done:false},
  {id:'q5',name:'Записать голосовое на английском',desc:'2–5 минут без подготовки',category:'Развитие',xp:25,done:false},
  {id:'q6',name:'Сделать недельный обзор',desc:'Что сработало, что мешало, что меняю',category:'Рефлексия',xp:25,done:false}
 ],
 logs:[], distractions:[], customAchievements:[], createdAt:new Date().toISOString()
});
let data;
try{data=JSON.parse(localStorage.getItem(KEY))||defaultData()}catch(e){data=defaultData()}
let page='dashboard';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Date().toISOString().slice(0,10);
const fmtDate=(d,opts={day:'numeric',month:'short'})=>new Date(d+'T12:00:00').toLocaleDateString('ru-RU',opts);
const getLog=d=>data.logs.find(x=>x.date===d);
function save(){localStorage.setItem(KEY,JSON.stringify(data));scheduleCloudSave();render(); }
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),2400)}
function xpTotal(){return data.logs.reduce((s,l)=>s+(+l.xp||0),0)+data.quests.filter(q=>q.done).reduce((s,q)=>s+(+q.xp||0),0)}
function level(){return Math.floor(xpTotal()/data.settings.levelSize)+1}
function nextXP(){return data.settings.levelSize-(xpTotal()%data.settings.levelSize)}
function weekLogs(){const now=new Date();const start=new Date(now);start.setDate(now.getDate()-6);return data.logs.filter(l=>new Date(l.date+'T12:00:00')>=start&&new Date(l.date+'T12:00:00')<=now)}
function streak(){let n=0,d=new Date();while(true){const key=d.toISOString().slice(0,10);if(getLog(key)){n++;d.setDate(d.getDate()-1)}else break}return n}
function statCard(label,val,note,cls='orange'){return `<div class="card"><div class="statlabel">${label}</div><div class="statvalue ${cls}">${val}</div><div class="statnote">${note}</div></div>`}
function head(eyebrow,title,desc,extra=''){return `<div class="pagehead"><div><div class="eyebrow">${eyebrow}</div><h2>${title}</h2><p>${desc}</p></div><div class="date">${fmtDate(today(),{weekday:'long',day:'numeric',month:'long'})}${extra}</div></div>`}
function getAchievements(){
 const logs=data.logs, habitsDone=logs.reduce((s,l)=>s+(l.habitsDone||[]).length,0), minutes=logs.reduce((s,l)=>s+(+l.english||0),0), focus=logs.reduce((s,l)=>s+(+l.focus||0),0);
 return [
  ['🚀','Первый запуск','Создать первую запись',logs.length>0],
  ['🔥','Первые 3 дня','Занести три разных дня',new Set(logs.map(l=>l.date)).size>=3],
  ['🧠','Языковой рывок','Набрать 300 минут английского',minutes>=300],
  ['🎯','Мастер фокуса','10 фокус-сессий по 25 минут',focus>=10],
  ['⚔️','Квестодатель','Завершить 3 квеста',data.quests.filter(q=>q.done).length>=3],
  ['📵','Контроль внимания','7 дней в рамках лимита TikTok',logs.filter(l=>l.tiktok<=data.settings.tiktokLimit&&l.tiktok!==null&&l.tiktok!==undefined).length>=7],
  ['📓','Рефлексия','Заполнить 5 заметок дня',logs.filter(l=>l.reflection&&l.reflection.trim()).length>=5],
  ['💎','Уровень 5','Достичь пятого уровня',level()>=5]
 ];
}
// Cloud sync uses Supabase Auth + a single JSON row protected by Row Level Security.
const CLOUD_CFG='dc-level-up-cloud-config-v1', CLOUD_SESSION='dc-level-up-cloud-session-v1', CLOUD_BASELINE='dc-level-up-cloud-baseline-v1';
let cloudTimer=null, cloudBusy=false, cloudPending=false, cloudPullBusy=false;
function cloudConfig(){try{return JSON.parse(localStorage.getItem(CLOUD_CFG)||'{}')}catch(e){return {}}}
function cloudSession(){try{const s=JSON.parse(localStorage.getItem(CLOUD_SESSION)||'null');if(s && s.expires_at && Date.now()>s.expires_at-60000){localStorage.removeItem(CLOUD_SESSION);return null}return s}catch(e){return null}}
function cloudStatus(msg){const el=document.querySelector('#syncStatus');if(el)el.textContent=msg;const label=document.querySelector('#cloudLabel');if(label)label.textContent=msg.replace(/^●\s*/, '')}
const stableJSON=v=>JSON.stringify(v);
function setCloudBaseline(v){try{localStorage.setItem(CLOUD_BASELINE,stableJSON(v))}catch(e){}}
function localMatchesBaseline(){try{return localStorage.getItem(CLOUD_BASELINE)===stableJSON(data)}catch(e){return false}}
async function cloudRequest(path,opts={}){const cfg=cloudConfig();if(!cfg.url||!cfg.key)throw Error('Сначала сохрани Project URL и anon/publishable key.');const session=cloudSession();const headers={'apikey':cfg.key,'Content-Type':'application/json',...(opts.headers||{})};if(session?.access_token)headers.Authorization='Bearer '+session.access_token;const r=await fetch(cfg.url.replace(/\/$/,'')+path,{...opts,headers});const body=await r.text();let parsed=null;try{parsed=body?JSON.parse(body):null}catch(e){}if(!r.ok)throw Error(parsed?.msg||parsed?.message||parsed?.error_description||parsed?.error||body||('HTTP '+r.status));return parsed}
function scheduleCloudSave(){if(!cloudSession())return;cloudPending=true;clearTimeout(cloudTimer);cloudTimer=setTimeout(()=>pushCloud().catch(e=>cloudStatus('⚠️ Не синхронизировано — '+e.message)),1000)}
async function pushCloud(){if(!cloudSession())return;if(cloudBusy){cloudPending=true;return}if(!navigator.onLine){cloudStatus('◌ Офлайн · изменения сохранены на устройстве');cloudPending=true;return}cloudBusy=true;cloudPending=false;cloudStatus('● Синхронизация…');try{const s=cloudSession();const rows=await cloudRequest('/rest/v1/dc_level_up?select=data,updated_at&user_id=eq.'+encodeURIComponent(s.user.id),{method:'GET'});const remote=rows&&rows.length?rows[0]:null;const baseline=localStorage.getItem(CLOUD_BASELINE);const localJSON=stableJSON(data);if(remote&&baseline&&stableJSON(remote.data)!==baseline&&localJSON!==baseline&&stableJSON(remote.data)!==localJSON){cloudStatus('⚠️ Конфликт: данные отличаются на другом устройстве');if(!confirm('На другом устройстве есть изменения, которых нет здесь. Нажми OK, чтобы сохранить текущую версию этого устройства в облако, или Отмена, чтобы оставить обе версии без перезаписи и сначала разобраться.')){cloudPending=true;return}}
await cloudRequest('/rest/v1/dc_level_up?on_conflict=user_id',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({user_id:s.user.id,data:data,updated_at:new Date().toISOString()})});setCloudBaseline(data);cloudStatus('☁️ Синхронизировано')}finally{cloudBusy=false;if(cloudPending){clearTimeout(cloudTimer);cloudTimer=setTimeout(()=>pushCloud().catch(e=>cloudStatus('⚠️ Не синхронизировано — '+e.message)),500)}}}
async function pullCloud(silent=false){const s=cloudSession();if(!s)throw Error('Сначала войди в облако.');if(!navigator.onLine)throw Error('Нет интернета. Локальные изменения сохранены на устройстве.');const rows=await cloudRequest('/rest/v1/dc_level_up?select=data,updated_at&user_id=eq.'+encodeURIComponent(s.user.id),{method:'GET'});if(rows&&rows.length&&rows[0].data){if(!silent||localMatchesBaseline()){data=rows[0].data;localStorage.setItem(KEY,JSON.stringify(data));setCloudBaseline(data);render();cloudStatus('☁️ Загружено из облака')}else if(stableJSON(rows[0].data)!==localStorage.getItem(CLOUD_BASELINE)){cloudStatus('⚠️ Есть облачные обновления · проверь синхронизацию');if(confirm('В облаке есть изменения с другого устройства. Загрузить их и заменить локальную версию? Нажми Отмена, чтобы оставить локальные данные и не перезаписывать их.')){data=rows[0].data;localStorage.setItem(KEY,JSON.stringify(data));setCloudBaseline(data);render();cloudStatus('☁️ Обновлено из облака')}else{cloudStatus('⚠️ Локальная версия не перезаписана')}}}else{await pushCloud();cloudStatus('☁️ Первый прогресс загружен в облако')}}
async function refreshFromCloudOnReturn(){if(cloudPullBusy||!cloudSession()||!navigator.onLine)return;cloudPullBusy=true;try{await refreshCloudSession();await pullCloud(true)}catch(e){cloudStatus('⚠️ Проверка облака не удалась — '+e.message)}finally{cloudPullBusy=false}}
function saveCloudSession(result){const s={...result,expires_at:Date.now()+((result.expires_in||3600)*1000)};localStorage.setItem(CLOUD_SESSION,JSON.stringify(s));return s}
async function refreshCloudSession(){let s=cloudSession();if(!s?.refresh_token)return s;try{const r=await cloudRequest('/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{Authorization:''},body:JSON.stringify({refresh_token:s.refresh_token})});return saveCloudSession(r)}catch(e){return s}}
function initCloudSettings(){const cfg=cloudConfig();const u=document.querySelector('#cloudUrl'),k=document.querySelector('#cloudKey');if(u)u.value=cfg.url||'';if(k)k.value=cfg.key||'';const s=cloudSession();if(s){cloudStatus('☁️ Облако подключено');const email=document.querySelector('#cloudEmail');if(email&&!email.value)email.value=s.user?.email||''}else cloudStatus('● Локальный режим · офлайн')}
function render(){document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.page===page));const app=$('#app');const map={dashboard:renderDashboard,quests:renderQuests,habits:renderHabits,analytics:renderAnalytics,distractions:renderDistractions,achievements:renderAchievements,settings:renderSettings};app.innerHTML=map[page]();bindPage()}
function renderDashboard(){
 const todayLog=getLog(today()), w=weekLogs(), weeklyXP=w.reduce((s,l)=>s+(+l.xp||0),0), avgMood=w.length?(w.reduce((s,l)=>s+(+l.mood||0),0)/w.length).toFixed(1):'—', dailyDone=todayLog?todayLog.habitsDone.length:0, active=data.habits.filter(h=>h.active).length;
 const q=data.quests.filter(x=>!x.done).slice(0,4);
 const bars=Array.from({length:7},(_,i)=>{const d=new Date();d.setDate(d.getDate()-(6-i));const k=d.toISOString().slice(0,10),l=getLog(k);return {label:['Вс','Пн','Вт','Ср','Чт','Пт','Сб'][d.getDay()],xp:l?l.xp:0}});
 const max=Math.max(25,...bars.map(b=>b.xp));
 return `${head('COMMAND CENTER','Твой прогресс. Твои правила.','Маленькие действия складываются в большую дистанцию.')}
 <div class="grid stats">

 const cf=$('#cloudForm');if(cf){initCloudSettings();$('#cloudConfigBtn').onclick=()=>{const url=$('#cloudUrl').value.trim().replace(/\/$/,'');const key=$('#cloudKey').value.trim();if(!url.startsWith('https://')||!key){alert('Введи корректный HTTPS Project URL и публичный anon/publishable key.');return}localStorage.setItem(CLOUD_CFG,JSON.stringify({url,key}));toast('Настройки подключения сохранены');cloudStatus('● Настройки сохранены')};cf.onsubmit=async e=>{e.preventDefault();try{const cfg=cloudConfig();if(!cfg.url||!cfg.key)throw Error('Сначала нажми «Сохранить настройки подключения».');const email=$('#cloudEmail').value.trim(),password=$('#cloudPassword').value;let r;try{r=await cloudRequest('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email,password})})}catch(err){if(!/invalid login credentials/i.test(err.message))throw err;r=await cloudRequest('/auth/v1/signup',{method:'POST',body:JSON.stringify({email,password})});if(!r?.access_token)throw Error('Аккаунт создан. Если в Supabase включено подтверждение email, подтверди почту, затем войди.')}if(r?.access_token){saveCloudSession(r);await pullCloud();toast('Облачный аккаунт подключён');render()}}catch(err){alert('Не удалось подключиться: '+err.message)}};
 const sync=$('#cloudSyncBtn');if(sync)sync.onclick=async()=>{try{await pushCloud();toast('Прогресс синхронизирован')}catch(e){alert('Ошибка синхронизации: '+e.message)}};
 const logout=$('#cloudLogoutBtn');if(logout)logout.onclick=()=>{localStorage.removeItem(CLOUD_SESSION);cloudStatus('● Выход выполнен — данные остались локально');toast('Выход из облака выполнен')};}
}
function saveDaily(){
 const habitsDone=[...document.querySelectorAll('[data-habit]:checked')].map(x=>x.dataset.habit);
 const old=getLog(today());
 const english=+($('#qEnglish')?.value??old?.english??0),focus=+($('#qFocus')?.value??old?.focus??0),tiktok=+($('#qTiktok')?.value??old?.tiktok??0),energy=+($('#qEnergy')?.value??old?.energy??3);
 const log={...(old||{}),date:today(),english,focus,tiktok,energy,mood:old?.mood||3,habitsDone,reflection:old?.reflection||'',xp:0};
 log.xp=calcLogXP(log);
 const idx=data.logs.findIndex(x=>x.date===today());if(idx>=0)data.logs[idx]=log;else data.logs.push(log);
 save();toast(`День сохранён · +${log.xp} XP`);
}
function exportData(){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='DC_LEVEL_UP_backup_'+today()+'.json';a.click();URL.revokeObjectURL(url);toast('Резервная копия скачана')}
function go(p){page=p;render();window.scrollTo({top:0,behavior:'smooth'})}
document.querySelectorAll('.navbtn').forEach(b=>b.onclick=()=>go(b.dataset.page));
$('#exportBtn').onclick=exportData;$('#quickAddBtn').onclick=()=>{go('dashboard');setTimeout(()=>$('#qEnglish')?.focus(),50)};
render();
if(cloudSession()){refreshCloudSession().then(s=>{if(s)saveCloudSession(s);cloudStatus('☁️ Облако подключено')}).catch(()=>{});}
window.addEventListener('online',()=>{if(cloudSession()){cloudStatus('● Интернет восстановлен · синхронизация…');if(cloudPending)scheduleCloudSave();else refreshFromCloudOnReturn()}});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')refreshFromCloudOnReturn()});
window.addEventListener('focus',()=>refreshFromCloudOnReturn());
if('serviceWorker' in navigator && location.protocol.startsWith('http')){navigator.serviceWorker.register('./sw.js').catch(()=>{})}
</script>
</body>
